<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modellassistent – Vorführung</title>
<meta name="description" content="Vorführung des Modellassistenten: Aus einem Satz wird ein geprüfter Eintrag im SysML-v2-Systemmodell. Der Mensch entscheidet. Aufgezeichnete Antworten aus einem Messlauf.">
<style>
/* Ruhig, groß, eine Handlung je Bildschirm. Keine Webschriften, keine externen Dateien. */
:root{
  --grund:#f6f4ef;--flaeche:#fff;--flaeche-2:#f1eee7;--text:#1c1a17;--leise:#5f5a52;--zart:#8b857b;--linie:#e3ded4;
  --akzent:#2a5bd7;--akzent-2:#1f47ad;--akzent-hell:#e8eefc;--gut:#17724a;--gut-hell:#e3f3ea;--frage:#8a5a00;--frage-hell:#fdf3dc;
  --R:#6a4fc0;--F:#b45a12;--L:#1f6db0;--P:#17724a;
  --schatten:0 1px 2px rgb(30 25 15/.05),0 10px 30px rgb(30 25 15/.08);
  --schrift:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--grund:#17150f;--flaeche:#211e18;--flaeche-2:#2a2620;--text:#f2efe8;--leise:#bdb6aa;--zart:#8f897e;
  --linie:#3a352d;--akzent:#7ea2ff;--akzent-2:#a3bdff;--akzent-hell:#232c45;--gut:#5cc795;--gut-hell:#1d3328;--frage:#f0c060;--frage-hell:#3a2f17;
  --R:#a993ff;--F:#f0a060;--L:#6fb2ef;--P:#5cc795;--schatten:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.35)}.knopf:not(.leise){color:#11141a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--grund);color:var(--text);font:18px/1.55 var(--schrift);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--akzent);outline-offset:3px;border-radius:10px}
.rahmen{max-width:820px;margin:0 auto;padding:22px 20px 28px;min-height:100vh;display:flex;flex-direction:column}
.kopf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.marke{font-weight:650;font-size:16px;letter-spacing:.01em}
.marke span{color:var(--zart);font-weight:400}
.punkte{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--zart)}
.punkte i{width:28px;height:6px;border-radius:3px;background:var(--linie);transition:background .3s}
.punkte i.an{background:var(--akzent)}
.buehne{flex:1}
h1{font:400 clamp(30px,5vw,44px)/1.12 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
.unter{color:var(--leise);font-size:19px;margin:0 0 26px;max-width:36em}
.wahl{display:grid;gap:14px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:18px;box-shadow:var(--schatten)}
button.beispiel{display:flex;align-items:center;gap:18px;text-align:left;padding:20px 22px;border:1px solid var(--linie);
  background:var(--flaeche);border-radius:18px;box-shadow:var(--schatten);transition:transform .12s,border-color .12s}
button.beispiel:hover{border-color:var(--akzent);transform:translateY(-1px)}
.beispiel .satz{font-size:20px;line-height:1.35;flex:1}
.beispiel .art{font-size:13px;color:var(--zart);display:block;margin-top:4px}
.beispiel .pfeil{font-size:24px;color:var(--akzent)}
.mehr{margin-top:18px;font-size:15px;color:var(--leise)}
.mehr button{background:none;border:0;color:var(--akzent);text-decoration:underline;text-underline-offset:3px;padding:2px 4px}

.zitat{font:400 clamp(24px,3.6vw,32px)/1.25 var(--serif);margin:0 0 20px}
.arbeit{padding:26px}
.arbeit ul{list-style:none;margin:0;padding:0}
.arbeit li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--zart);transition:color .3s}
.arbeit li b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--linie);font-size:14px;flex:none}
.arbeit li.da{color:var(--text)}.arbeit li.da b{background:var(--gut);border-color:var(--gut);color:#fff}
.arbeit li.jetzt b{border-color:var(--akzent);border-top-color:transparent;animation:dreh 0.8s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}

.zaehler{font-size:14px;color:var(--zart);margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.vorschlag{padding:24px 24px 22px;border-top:6px solid var(--farbe)}
.vorschlag.R{--farbe:var(--R)}.vorschlag.F{--farbe:var(--F)}.vorschlag.L{--farbe:var(--L)}.vorschlag.P{--farbe:var(--P)}
.typ{display:inline-block;font-size:14px;font-weight:650;color:var(--farbe);margin-bottom:6px}
.aussage{font-size:24px;line-height:1.35;margin:0 0 14px;font-weight:550}
.bezug{font-size:16px;color:var(--leise);margin:0 0 16px}
.bezug b{color:var(--text);font-weight:600}
.beleg{background:var(--gut-hell);border-radius:14px;padding:14px 16px;margin:0 0 20px}
.beleg small{display:block;color:var(--gut);font-weight:650;font-size:13.5px;margin-bottom:3px}
.beleg q{font-size:17px}
.knoepfe{display:flex;gap:12px;flex-wrap:wrap}
.knopf{border:0;border-radius:14px;padding:15px 24px;font-weight:650;font-size:18px;background:var(--akzent);color:#fff}
.knopf:hover{background:var(--akzent-2)}
.knopf.gut{background:var(--gut)}.knopf.gut:hover{filter:brightness(.92)}
.knopf.leise{background:var(--flaeche-2);color:var(--text)}
.knopf.leise:hover{background:var(--linie)}
.klein{font-size:14.5px;color:var(--zart)}

.ok{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;background:var(--gut-hell);border-radius:18px;margin-bottom:18px}
.ok .haken{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gut);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.ok h2{margin:2px 0 4px;font-size:22px}
.ok p{margin:0;color:var(--leise);font-size:16px}
.bild{padding:22px;margin-bottom:16px}
.bild h3{margin:0 0 14px;font-size:15px;color:var(--zart);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kette{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.box{border:2px solid var(--farbe);border-radius:14px;padding:10px 14px;min-width:170px;background:var(--flaeche)}
.box.alt{border-style:dashed;opacity:.8}
.box small{display:block;color:var(--farbe);font-weight:650;font-size:12.5px}
.box span{font-family:var(--mono);font-size:15px}
.box.R{--farbe:var(--R)}.box.F{--farbe:var(--F)}.box.L{--farbe:var(--L)}.box.P{--farbe:var(--P)}
.verbinder{color:var(--zart);font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.verbinder::after{content:"→";font-size:22px;color:var(--leise)}
details{border-top:1px solid var(--linie);padding:12px 0}
details summary{cursor:pointer;font-weight:600;font-size:16px}
pre{background:#14171d;color:#dfe6ef;border-radius:12px;padding:14px 16px;overflow:auto;font:13.5px/1.55 var(--mono);margin:12px 0 4px}
.kw{color:#8cc8ff}.km{color:#7f8a99;font-style:italic}.kz{color:#ffd28a}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:15px}
.log li{padding:8px 0;border-bottom:1px dashed var(--linie)}
.log code{display:block;font-size:11.5px;color:var(--zart);word-break:break-all;margin-top:2px}

.frage{padding:24px;background:var(--frage-hell);border:1px solid color-mix(in oklab,var(--frage) 30%,transparent);border-radius:18px;margin-bottom:18px}
.frage small{color:var(--frage);font-weight:650;font-size:14px}
.frage p{font:400 clamp(22px,3.2vw,28px)/1.3 var(--serif);margin:8px 0 0}
.fuss{margin-top:28px;font-size:13.5px;color:var(--zart);border-top:1px solid var(--linie);padding-top:14px}
.fuss a{color:inherit}
.ein{animation:ein .35s ease both}
@keyframes ein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:600px){html,body{font-size:17px}.rahmen{padding:16px 14px}.aussage{font-size:21px}.knopf{flex:1}
  .beispiel .satz{font-size:18px}.box{min-width:0;flex:1 1 100%}.verbinder{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rahmen">
  <header class="kopf">
    <div class="marke">Modellassistent <span>· Vorführung</span></div>
    <div class="punkte" aria-label="Fortschritt"><i></i><i></i><i></i></div>
  </header>
  <main class="buehne" id="buehne" aria-live="polite"></main>
  <footer class="fuss" id="fuss"></footer>
</div>
<script>
"use strict";
const D = /*DATEN*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zahl = x => Number(x).toLocaleString("de-DE", {maximumFractionDigits: 1});
const TYP = {R: "Neue Anforderung", F: "Neue Funktion", L: "Neuer Bausteintyp", P: "Neues Bauteil im Fahrzeug"};
const KURZ = {R: "Anforderung", F: "Funktion", L: "Bausteintyp", P: "Bauteil"};
const NAMEN = {};
for (const m of D.modell.matchAll(/<'([RFLP]-\d+)'>\s+(\w+)/g)) NAMEN[m[1]] = m[2];
const datum = new Date(D.meta.zeit_utc).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Europe/Berlin"});
$("#fuss").innerHTML = `Aufgezeichnete Antworten des Sprachmodells Qwen3.8 (27 Mrd. Parameter, lokal) aus dem Messlauf vom ${datum}.
  Auf dieser Seite läuft keine KI, und nichts wird gesendet. Modell und Lastenheft sind erfundene Beispieldaten.
  Quellcode: <a href="https://github.com/panoherbe/modellassistent">github.com/panoherbe/modellassistent</a>`;

let a = null, i = 0, ent = {}, log = [];
const schritt = n => document.querySelectorAll(".punkte i").forEach((p, k) => p.classList.toggle("an", k < n));
const zeige = html => { const b = $("#buehne"); b.innerHTML = `<div class="ein">${html}</div>`; window.scrollTo({top: 0}); };
const merke = (was, text) => log.push({was, text, zeit: new Date()});

function start() {
  schritt(1); a = null;
  const karte = id => { const x = D.aufgaben.find(t => t.id === id);
    return `<button class="beispiel" data-id="${id}"><span class="satz">„${esc(x.eingabe)}“<span class="art">${esc(D.etiketten[id] || "")}</span></span><span class="pfeil" aria-hidden="true">→</span></button>`; };
  zeige(`<h1>Was soll ins Systemmodell?</h1>
    <p class="unter">Ein Satz in Alltagssprache genügt. Wählen Sie einen Wunsch; der Assistent macht daraus einen Vorschlag, und Sie entscheiden.</p>
    <div class="wahl">${D.vorne.map(karte).join("")}</div>
    <p class="mehr">Weitere Beispiele: ${D.weitere.map(id => `<button data-id="${id}">${esc(D.aufgaben.find(t => t.id === id).eingabe)}</button>`).join(" · ")}</p>`);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => los(b.dataset.id));
}

async function los(id) {
  a = D.aufgaben.find(t => t.id === id); i = 0; ent = {}; log = [];
  schritt(1); merke("Wunsch", "„" + a.eingabe + "“");
  const zeilen = ["Lastenheft durchsuchen", "Prüfen, ob der Wunsch eindeutig ist", "Vorschlag erstellen und mit 13 Regeln prüfen"];
  zeige(`<p class="zaehler">Der Assistent arbeitet</p><p class="zitat">„${esc(a.eingabe)}“</p>
    <div class="karte arbeit"><ul>${zeilen.map((z, k) => `<li><b>${k + 1}</b>${z}</li>`).join("")}</ul></div>
    <p class="klein" style="margin-top:14px">Im Messlauf dauerte das ${zahl(a.dauer_s)} Sekunden; hier abgekürzt.</p>`);
  const lis = document.querySelectorAll(".arbeit li");
  for (let k = 0; k < lis.length; k++) { lis[k].classList.add("jetzt"); await warte(650); lis[k].classList.remove("jetzt"); lis[k].classList.add("da"); lis[k].querySelector("b").textContent = "✓"; }
  await warte(250);
  merke("Suche im Lastenheft", `${a.abgerufen.length} passende Absätze gefunden`);
  if (a.status === "rueckfrage") return rueckfrage();
  merke("Vorschlag", `${a.elemente.length} ${a.elemente.length === 1 ? "Ergänzung" : "Ergänzungen"}, alle Prüfregeln bestanden`);
  pruefen();
}
const warte = ms => new Promise(r => setTimeout(r, ms));

function rueckfrage() {
  schritt(2); merke("Rückfrage", a.rueckfragen.join(" "));
  zeige(`<p class="zaehler">Rückfrage statt Raten</p><p class="zitat">„${esc(a.eingabe)}“</p>
    <div class="frage"><small>Der Assistent fragt nach</small>${a.rueckfragen.map(f => `<p>${esc(f)}</p>`).join("")}</div>
    <p class="unter">Fehlt eine Angabe oder widerspricht der Wunsch dem Lastenheft, schlägt der Assistent nichts vor. Das Modell bleibt
    unverändert. Im Messlauf hat er bei ${D.kennzahlen.rueckfrage_richtig} von ${D.kennzahlen.rueckfrageaufgaben} solchen Wünschen nachgefragt.</p>
    <div class="knoepfe"><button class="knopf" id="weiter">Anderen Wunsch wählen</button></div>`);
  $("#weiter").onclick = start;
}

function name(id) { const n = a.elemente.find(e => e.id === id); return n ? n.name : (NAMEN[id] || id); }

function pruefen() {
  schritt(2);
  const e = a.elemente[i], n = a.elemente.length;
  const bez = (e.bezuege || []).map(b => `${b.art === "satisfy" ? "Erfüllt durch" : "Ausgeführt von"} <b>${esc(name(b.ziel))}</b> (${KURZ[b.ziel[0]]}${a.elemente.some(x => x.id === b.ziel) ? ", neu" : ""})`);
  if (e.ebene === "P" && e.typ) bez.unshift(`Typ <b>${esc(e.typ)}</b>`);
  for (const b of e.bezuege_von || []) bez.push(`${b.art === "satisfy" ? "Erfüllt" : "Führt aus"} <b>${esc(name(b.quelle))}</b>`);
  const q = e.quellen[0];
  zeige(`<p class="zaehler">Vorschlag ${i + 1} von ${n} · Bitte entscheiden</p>
    <div class="karte vorschlag ${e.ebene}">
      <span class="typ">${TYP[e.ebene]}</span>
      <p class="aussage">${esc(e.text || ("Bauteil vom Typ " + e.typ))}</p>
      <p class="bezug">Name im Modell <b>${esc(e.name)}</b>${bez.length ? " · " + bez.join(" · ") : ""}</p>
      ${q ? `<div class="beleg"><small>✓ Beleg, wörtlich im Lastenheft gefunden (Abschnitt ${esc(q.quelle.slice(3))})</small><q>${esc(q.zitat)}</q></div>` : ""}
      <div class="knoepfe"><button class="knopf gut" data-e="angenommen">✓ Übernehmen</button><button class="knopf leise" data-e="abgelehnt">Verwerfen</button></div>
    </div>
    <p class="klein" style="margin-top:14px">Ins Modell kommt nur, was Sie übernehmen.</p>`);
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => {
    ent[e.id] = b.dataset.e; merke("Entscheidung", `${KURZ[e.ebene]} ${e.name}: ${b.dataset.e === "angenommen" ? "übernommen" : "verworfen"}`);
    if (++i < n) pruefen(); else ergebnis();
  });
}

function sysmlFuer(ja) {
  const weg = a.elemente.filter(e => !ja.includes(e.id));
  if (!weg.length) return a.sysml;
  return a.sysml.split(/\n\n/).map(block => {
    if (weg.some(e => block.includes(`<'${e.id}'>`))) return null;
    const z = block.split("\n").filter(l => !weg.some(e => new RegExp(`\\b${e.name}\\b`).test(l)));
    return z.filter(l => !l.startsWith("//")).length ? z.join("\n") : null;
  }).filter(Boolean).join("\n\n");
}
const farbe = t => esc(t).split("\n").map(z => /^\s*\/\//.test(z) ? `<span class="km">${z}</span>` :
  z.replace(/(&lt;'[RFLP]-\d+'&gt;)/g, '<span class="kz">$1</span>').replace(/\b(requirement|action|part|def|satisfy|by|allocate|to|doc)\b/g, '<span class="kw">$1</span>')
   .replace(/(\/\*.*?\*\/)/g, '<span class="km">$1</span>')).join("\n");

async function kette() {
  let vor = "0".repeat(64);
  for (const e of log) {
    if (!(window.crypto && crypto.subtle)) return;
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(vor + e.was + e.text + e.zeit.toISOString()));
    e.hash = vor = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
}

function bild(ja) {
  const neu = a.elemente.filter(e => ja.includes(e.id)).sort((x, y) => "RFLP".indexOf(x.ebene) - "RFLP".indexOf(y.ebene));
  const kasten = (id, alt) => `<div class="box ${id[0]}${alt ? " alt" : ""}"><small>${KURZ[id[0]]}${alt ? " (schon im Modell)" : " · neu"}</small><span>${esc(name(id))}</span></div>`;
  const reihen = [];
  for (const e of neu) {
    for (const b of e.bezuege || []) if (!a.elemente.some(x => x.id === b.ziel) || ja.includes(b.ziel))
      reihen.push(`<div class="kette">${kasten(e.id)}<span class="verbinder">${b.art === "satisfy" ? "erfüllt durch" : "ausgeführt von"}</span>${kasten(b.ziel, !a.elemente.some(x => x.id === b.ziel))}</div>`);
    for (const b of e.bezuege_von || []) reihen.push(`<div class="kette">${kasten(b.quelle, true)}<span class="verbinder">${b.art === "satisfy" ? "erfüllt durch" : "ausgeführt von"}</span>${kasten(e.id)}</div>`);
    if (e.ebene === "P" && e.typ) { const l = a.elemente.find(x => x.ebene === "L" && x.name === e.typ);
      if (!l || ja.includes(l.id)) reihen.push(`<div class="kette">${kasten(e.id)}<span class="verbinder">ist vom Typ</span><div class="box L${l ? "" : " alt"}"><small>Bausteintyp${l ? " · neu" : " (schon im Modell)"}</small><span>${esc(e.typ)}</span></div></div>`); }
  }
  const allein = neu.filter(e => !reihen.some(r => r.includes(`>${esc(e.name)}<`)));
  return reihen.join("") + allein.map(e => `<div class="kette">${kasten(e.id)}</div>`).join("");
}

async function ergebnis() {
  schritt(3);
  const ja = a.elemente.filter(e => ent[e.id] === "angenommen").map(e => e.id);
  if (!ja.length) {
    merke("Ergebnis", "nichts übernommen, Modell unverändert"); await kette();
    zeige(`<h1>Nichts übernommen.</h1><p class="unter">Das Modell bleibt, wie es war. Auch das steht im Protokoll.</p>
      <div class="knoepfe"><button class="knopf" id="weiter">Noch ein Beispiel</button></div>`);
    $("#weiter").onclick = start; return;
  }
  const alle = ja.length === a.elemente.length;
  merke("Ins Modell übernommen", ja.map(name).join(", ")); await kette();
  zeige(`<div class="ok"><div class="haken">✓</div><div><h2>Im Modell. ${ja.length === 1 ? "Eine Ergänzung" : ja.length + " Ergänzungen"}, belegt und geprüft.</h2>
    <p>${alle ? `Nach dem Einfügen hat die SysML-v2-Pilotimplementierung der OMG das ganze Modell geprüft: <b>gültig</b> (Messlauf vom ${datum}).`
      : `Der Text enthält nur, was Sie übernommen haben. Die OMG-Prüfung im Messlauf galt der vollständigen Übernahme; der Prototyp prüft jede Teilübernahme neu.`}</p></div></div>
    <div class="karte bild"><h3>So hängt es im Modell zusammen</h3>${bild(ja)}</div>
    <div class="karte" style="padding:6px 22px 10px;margin-bottom:20px">
      <details><summary>SysML-v2-Text ansehen</summary><pre>${farbe(sysmlFuer(ja))}</pre>
        <p class="klein">Aus Vorlagen erzeugt; das Sprachmodell schreibt nie frei ins Modell.</p></details>
      <details><summary>Protokoll ansehen (${log.length} Einträge)</summary><ul class="log">${log.map(e => `<li><b>${esc(e.was)}</b> · ${esc(e.text)}${e.hash ? `<code>${e.hash}</code>` : ""}</li>`).join("")}</ul>
        <p class="klein">Jeder Eintrag enthält den Prüfwert des vorigen: Wer später etwas ändert, fällt auf.</p></details>
    </div>
    <div class="knoepfe"><button class="knopf" id="weiter">Noch ein Beispiel</button></div>`);
  $("#weiter").onclick = start;
}

// Direktlink für Bilder und Video: ?beispiel=C01 startet sofort
const q = new URLSearchParams(location.search).get("beispiel");
if (q && D.aufgaben.some(t => t.id === q)) los(q); else start();
</script>
</body>
</html>
